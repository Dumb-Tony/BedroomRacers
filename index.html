<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Bedroom Racers — Phase 1 Driving Test</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #2b2622;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: #e8e2d8;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }

  /* The tuning panel styles itself — see src/ui/Debug.js.
     They used to live here, which meant the bundled single-file build shipped
     the panel unstyled and it fell to the bottom of the document instead of
     floating over the canvas. Do not add #debug rules back to this file. */
</style>
</head>
<body>

<canvas id="game"></canvas>

<!--
  Plain script tags, loaded in dependency order — NOT ES modules.
  ES modules are blocked by CORS over file://, and this machine has no Node or
  Python to serve from. Classic scripts mean the game runs by double-clicking
  this file, with no toolchain at all.

  Converting to ES modules is mechanical, and should happen alongside the build
  step in 14_Technical_Architecture.md open question 1.
-->
<script src="src/config/tuning.js"></script>
<script src="src/systems/MathUtil.js"></script>
<script src="src/systems/Projection.js"></script>
<script src="src/systems/Input.js"></script>
<script src="src/data/vehicles.js"></script>
<script src="src/data/tracks/town-rug-loop.js"></script>
<script src="src/entities/Vehicle.js"></script>
<script src="src/systems/VehicleController.js"></script>
<script src="src/systems/Collision.js"></script>
<script src="src/systems/TrackManager.js"></script>
<script src="src/systems/AIDriver.js"></script>
<script src="src/systems/RaceManager.js"></script>
<script src="src/render/Particles.js"></script>
<script src="src/render/Renderer.js"></script>
<script src="src/ui/HUD.js"></script>
<script src="src/ui/Debug.js"></script>
<script src="src/main.js"></script>

</body>
</html>
