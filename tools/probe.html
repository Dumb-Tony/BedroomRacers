<!-- =============================================================================
     WHICH OBJECTIVES CAN THE REFERENCE DRIVER ACTUALLY EARN, EVENT BY EVENT?
     =============================================================================
     career.html answers "how far does the ladder let you get" and stalls at the
     second event, which tells you there is a wall but not what is behind it.
     This drives every event with the gate ignored, and scores each of the nine
     objective predicates against what the drive actually produced.

     Same input swap as career.html: the seat stays kind 'player', so drift,
     impacts and pieces are all accumulated.
     ========================================================================= -->
<pre id="probe">running…</pre>
<script>
(function () {
  var L = [], G = BR.Game, P = BR.ProgressionManager, S = BR.SaveManager;
  BR.Particles.init();

  var seed = 1;
  Math.random = function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  var playerAI = null;
  var realSample = BR.Input.sample;
  BR.Input.sample = function (profile, seat) {
    if (playerAI && G.vehicle && G.arena) {
      return BR.AIDriver.drive(playerAI, G.vehicle, G.arena, 1 / 60);
    }
    return realSample.call(BR.Input, profile, seat);
  };

  function race(ev, s, personality, difficulty) {
    seed = s;
    S.get().settings.difficulty = difficulty;
    playerAI = BR.AIDriver.create(personality, difficulty);
    G.players = 1;
    G.startEvent(ev);
    var me = G.racers[0];
    var t = 0;
    while (t < 60 * 400 && !me.finished) { G.step(1 / 60); t++; }
    return { finished: me.finished, time: me.finishTime, bestLap: me.bestLap,
             position: me.position, total: G.racers.length,
             collisions: G.vehicle.impacts, driftSeconds: G.stats.driftSeconds,
             pieces: G.stats.piecesThisRace };
  }

  var ALL = ['finish', 'podium', 'win', 'clean', 'spotless', 'drifter',
             'lap', 'ttGold', 'ttPlat'];

  /* Score EVERY predicate, not only the ones the event currently carries --
     the question is what an objective set COULD be built from here. */
  function score(ev, r) {
    var got = {};
    got.finish   = r.finished;
    got.podium   = r.position <= 3;
    got.win      = r.position === 1;
    got.clean    = r.collisions < 4;
    got.spotless = r.position === 1 && r.collisions === 0;
    got.drifter  = r.driftSeconds >= 6;
    got.lap      = r.bestLap !== null && r.bestLap < (ev.id === 'rug-route-03' ? 27 : 29);
    got.ttGold   = r.time !== null && ev.times && r.time <= ev.times.gold;
    got.ttPlat   = r.time !== null && ev.platinumTime && r.time <= ev.platinumTime;
    return got;
  }

  function run(personality, difficulty, seeds) {
    S.reset();
    L.push('');
    L.push('== ' + personality + ' on ' + difficulty + ', ' + seeds.length +
           ' attempts, gates ignored ==');
    L.push('  ' + ['event', 'mode', 'pos', 'time', 'bestLap', 'coll', 'drift',
                   'CAN EARN (union)', 'currently asks', 'gets'].join('\t'));
    var supply = 0, asked = 0;
    for (var i = 0; i < BR.EVENTS.length; i++) {
      var ev = BR.EVENTS[i];
      var union = {}, best = null;
      var pos = [], tms = [], lps = [], cls = [], drs = [];
      for (var k = 0; k < seeds.length; k++) {
        var r = race(ev, seeds[k], personality, difficulty);
        var g = score(ev, r);
        for (var a in g) if (g[a]) union[a] = true;
        pos.push(r.position + '/' + r.total);
        tms.push(r.time == null ? '-' : r.time.toFixed(1));
        lps.push(r.bestLap == null ? '-' : r.bestLap.toFixed(1));
        cls.push(r.collisions);
        drs.push(r.driftSeconds.toFixed(1));
      }
      var can = [];
      for (var a2 = 0; a2 < ALL.length; a2++) if (union[ALL[a2]]) can.push(ALL[a2]);
      var asks = [], gets = [];
      for (var j = 0; j < ev.objectives.length; j++) {
        asks.push(ev.objectives[j].id);
        if (union[ev.objectives[j].id]) gets.push(ev.objectives[j].id);
      }
      supply += gets.length; asked += asks.length;
      L.push('  ' + [ev.id, ev.mode === 'time-trial' ? 'TT' : (ev.items ? 'ITEM' : 'race'),
                     pos.join(','), tms.join(','), lps.join(','), cls.join(','),
                     drs.join(','), can.join('+') || 'NOTHING',
                     asks.join('+'), gets.join('+') || 'NONE'].join('\t'));
    }
    L.push('  ---');
    L.push('  REACHABLE SUPPLY at this skill: ' + supply + ' of ' + asked + ' stars');
    return supply;
  }

  try {
    run('technician', 'normal', [1, 2, 3]);
    run('bully', 'normal', [1, 2, 3]);
    L.push('PROBE DONE');
  } catch (e) {
    L.push('THREW: ' + (e && e.message ? e.message : e) +
           (e && e.stack ? '\n' + e.stack : ''));
    L.push('PROBE DONE');
  }
  document.getElementById('probe').textContent = L.join('\n');
})();
</script>
