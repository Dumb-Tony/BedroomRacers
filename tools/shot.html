<!-- =============================================================================
     RENDER ONE FRAME AND SAVE IT, so a claim about how something LOOKS can be
     checked by looking.
     =============================================================================
     Appended to a built dist/play.html by tools/shot.sh.

     ── it drives the game's REAL loop, on a fake clock ───────────────────────
     The obvious harness starts an event, steps the simulation by hand and calls
     Renderer.render(). It produces an EMPTY FRAME, and three separate theories
     about why were all wrong before the actual cause turned up:

       - render(game, alpha, dt) takes THREE arguments. render(game, 0) reads
         perfectly naturally as "no time step" and actually passes dt =
         undefined, which turns the camera feel maths to NaN.
       - and even called correctly it still draws nothing, because the view
         CAMERAS are updated inside the frame path. A render on its own draws
         a world through a camera that was never pointed anywhere.

     Both were chased while an innocent art change sat under suspicion. What
     settled it was rendering the same scene from the build BEFORE that change
     and getting an identical empty frame.

     So the harness does not bypass the loop. It wraps Game.frame, feeds it a
     SYNTHETIC timestamp advancing exactly 1/60s per call, counts frames, and
     stops re-arming when it has enough. Everything the real game does per
     frame — camera follow, cull bounds, interpolation — happens exactly as it
     does in play.

     The fake clock is not fussiness. performance.now() does not advance under
     headless virtual time, and pacing by wall clock gave the countdown on one
     run and three minutes of racing on the next, from the same budget.
     ========================================================================= -->
<script>
(function () {
  function boot() {
    var eventId = window.__SHOT_EVENT || 'rug-route-01';
    var secs    = window.__SHOT_SECS || 8;
    var wantAir = !!window.__SHOT_AIR;

    // The click-to-drive veil belongs to the artifact page, not the game, and
    // it dims the canvas it covers. Nothing else is touched: removing layout
    // nodes resizes the canvas without telling the renderer.
    var f = document.getElementById('focus');
    if (f) f.remove();

    try {
      var G = BR.Game;

      /* SEEDED, or the same command gives a different race every time. The AI
         wanders and errs on purpose (04_AI.md), so two runs of this drifted far
         enough apart to produce visibly different frames — which makes a
         before/after pair worthless, since you cannot tell your change from the
         race having gone differently. Same generator as tools/pays.sh. */
      var seed = window.__SHOT_SEED || 1;
      Math.random = function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        var x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
        return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
      };

      BR.Particles.init();
      var ev = BR.eventById(eventId);
      if (!ev) { document.title = 'SHOT ERROR: no event ' + eventId; return; }
      G.startEvent(ev);

      // The player's seat has no human, so the camera would watch a parked
      // bumper. Technician on `normal` — the calibrate.sh stand-in.
      var me = G.racers[0];
      me.ai = BR.AIDriver.create('technician', 'normal');
      for (var i = 0; i < G.actors.length; i++) {
        if (G.actors[i].racer === me) G.actors[i].kind = 'ai';
      }
      var v = me.vehicle;

      var target = Math.round(secs * 60);
      var orig = G.frame, n = 0, fake = 0, done = false;

      G.frame = function (t) {
        /* FROZEN BY STOPPING THE CLOCK, not by stopping the loop.

           Ceasing to re-arm gives a BLANK capture: with no further frames the
           compositor hands Chrome a surface from before the canvas was ever
           painted, and the shot comes out empty even though six hundred frames
           rendered perfectly first. Every shot that ever worked had the loop
           still running when the capture landed.

           So the loop keeps going and the CLOCK stops. `fake` stops advancing,
           every subsequent frame gets dt = 0, the simulation and the camera sit
           exactly where they were, and the page carries on producing identical
           frames until Chrome takes one. */
        if (!done) fake += 1000 / 60;     // exactly one tick, whatever the clock says
        orig.call(this, fake);            // once frozen, dt is 0 and nothing moves
        if (done) return;
        n++;

        /* Hold for a jump. Height, shadows and landings cannot be judged from a
           car sitting on the floor, and the airborne moments are about two
           seconds of a ninety-second lap — far too easy to miss by guessing a
           timestamp. v.z is ALREADY height above the deck the car is on; v.roadZ
           is the deck. Subtracting one from the other asks for height above
           height, which never goes positive on an elevated track, and the hold
           silently ran the whole race and captured the results card. */
        if (n >= target && (!wantAir || (v.z > 18 && !v.grounded) || me.finished)) {
          done = true;
          /* TAKE THE PIXELS FROM THE CANVAS, not from Chrome's compositor.
             --screenshot fires when the virtual time budget runs out, which is
             a race the harness kept losing: the same command produced a good
             frame and an empty one on alternate runs, and freezing the loop
             made it lose every time because a page that has stopped drawing
             hands over a surface from before it ever painted. toDataURL reads
             the canvas backing store directly, at the exact frame chosen, and
             cannot be early. */
          var cv = document.getElementById('game');
          var pre = document.createElement('pre');
          pre.id = 'shotdata';
          pre.textContent = cv.toDataURL('image/png');
          document.body.appendChild(pre);
          document.title = 'SHOT ' + eventId + ' frame=' + n + ' z=' + v.z.toFixed(1);
        }
      };
    } catch (e) {
      document.title = 'SHOT ERROR: ' + (e && e.message ? e.message : e);
    }
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
})();
</script>
