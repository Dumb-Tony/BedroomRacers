<!-- =============================================================================
     RENDER ONE FRAME AND SAVE IT, so a claim about how something LOOKS can be
     checked by looking.
     =============================================================================
     Appended to a built dist/play.html by tools/shot.sh.

     ── everything here is synchronous, on purpose ───────────────────────────
     No requestAnimationFrame, no waiting, no virtual-time budget to lose a race
     against. The page steps the simulation and renders, in a plain loop, and
     hands the canvas out as a data URL. Same input, same pixels, every time.

     An earlier version drove the game's own rAF loop and was FLAKY: asking for
     one second of game time failed, two seconds worked, four seconds failed
     again, on an idle machine. Chrome's virtual clock is spent by a busy page
     in ways that are not reproducible, so anything paced by it is a lottery —
     and a harness that fails at random is worse than no harness at all
     (17_Claude_Rules.md).

     ── dt must be REAL ──────────────────────────────────────────────────────
     render(game, alpha, dt) takes THREE arguments, and both of the obvious
     mistakes produce a frame with the HUD and the speed streaks floating over
     an empty floor — which looks exactly like the renderer having broken, and
     cost an hour of suspecting an innocent art change before the argument list
     was simply read:

       - render(game, 0) reads naturally as "no time step" and actually passes
         dt = undefined. The camera feel maths goes NaN and the whole world
         projects to nowhere.
       - render(game, 1, 0) passes a real zero, which is worse because it looks
         careful. The camera EASES toward the car every frame; with dt = 0 it
         never moves, so the world is drawn through a camera still sitting where
         it was initialised.

     So the loop below renders with the same 1/60 it steps with.
     ========================================================================= -->
<script>
(function () {
  function boot() {
    var eventId = window.__SHOT_EVENT || 'rug-route-01';
    var secs    = window.__SHOT_SECS || 8;
    var wantAir = !!window.__SHOT_AIR;

    // The click-to-drive veil belongs to the artifact page, not the game, and
    // it dims the canvas it covers. Nothing else is touched: removing layout
    // nodes resizes the canvas without telling the renderer.
    var f = document.getElementById('focus');
    if (f) f.remove();

    try {
      var G = BR.Game;

      /* Stop the game's own loop. It re-arms itself unconditionally and would
         keep stepping and redrawing underneath this one, with a dt taken from
         performance.now() — which is frozen under headless virtual time. */
      G.frame = function () {};

      /* SEEDED, or the same command gives a different race every time. The AI
         wanders and errs on purpose (04_AI.md), and two runs drifted far enough
         apart to produce visibly different frames — which makes a before/after
         pair worthless, since you cannot tell your change from the race having
         gone differently. Same generator as tools/pays.sh. */
      var seed = window.__SHOT_SEED || 1;
      Math.random = function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        var x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
        return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
      };

      BR.Particles.init();
      var ev = BR.eventById(eventId);
      if (!ev) { document.title = 'SHOT ERROR: no event ' + eventId; return; }
      G.startEvent(ev);

      // The player's seat has no human, so the camera would watch a parked
      // bumper. Technician on `normal` — the calibrate.sh stand-in.
      var me = G.racers[0];
      me.ai = BR.AIDriver.create('technician', 'normal');
      for (var i = 0; i < G.actors.length; i++) {
        if (G.actors[i].racer === me) G.actors[i].kind = 'ai';
      }
      var v = me.vehicle;

      var DT = 1 / 60;
      var n = 0, target = Math.round(secs * 60);
      for (; n < target; n++) { G.step(DT); BR.Renderer.render(G, 1, DT); }

      /* Hold for a jump. Height, shadows and landings cannot be judged from a
         car sitting on the floor, and the airborne moments are about two
         seconds of a ninety-second lap — far too easy to hit by guessing a
         timestamp. v.z is ALREADY height above the deck the car is on; v.roadZ
         is the deck. Subtracting one from the other asks for height above
         height, which never goes positive on an elevated track, and an earlier
         version of this hold silently ran the whole race and captured the
         results card. */
      if (wantAir) {
        var guard = 60 * 150;
        while (guard-- > 0 && !me.finished && !(v.z > 18 && !v.grounded)) {
          G.step(DT); BR.Renderer.render(G, 1, DT); n++;
        }
      }

      var cv = document.getElementById('game');
      var pre = document.createElement('pre');
      pre.id = 'shotdata';
      pre.textContent = cv.toDataURL('image/png');
      document.body.appendChild(pre);
      document.title = 'SHOT ' + eventId + ' frame=' + n + ' z=' + v.z.toFixed(1);
    } catch (e) {
      document.title = 'SHOT ERROR: ' + (e && e.message ? e.message : e);
    }
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
})();
</script>
