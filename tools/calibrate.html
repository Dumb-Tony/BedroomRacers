<!-- =============================================================================
     WHAT DOES A LAP ACTUALLY TAKE, ON EVERY EVENT?
     =============================================================================
     Appended to a built dist/play.html by tools/calibrate.sh.

     This exists because a whole afternoon was spent recalibrating fifteen events
     that had never moved.

     The reasoning that went wrong is worth stating exactly, because it looked
     like evidence. Every standard race read 2 to 4 seconds quicker than the
     reference recorded beside its target time, and no time trial on an untouched
     track did. Races have opponents and time trials do not, an AI commit had
     just landed, and so the story told itself: the AI change handed every race
     a few seconds and nobody re-measured. Fifteen events were rewritten on it.

     Items do not exist in standard races. The AI commit could not have touched
     them, and building six older commits and measuring each showed the race
     times were IDENTICAL at every one of them, including the commit that had
     written those very references.

     Nothing had drifted. The recorded numbers were simply produced by a
     different stand-in than the one this harness drives, and the gap between
     two conventions is indistinguishable from a regression if you only ever
     measure once.

     So the tool does not ask "does this match a ratio I assumed?". It records
     what every event measures TODAY into tools/reference-times.txt, which is
     committed. The question it answers is the only one that is safe to ask:
     WHAT CHANGED SINCE LAST TIME? A number that moved is a real effect, in the
     units the game is played in, and a number that did not move needs nothing
     done to it however wrong its target may look.

     THE STAND-IN: technician on `normal`, in seat one, five seeds, median.
     That pairing is the reference every target time in the game means
     (04_AI.md) and must not be moved to make a number nicer. It is not
     necessarily the stand-in that produced the targets currently in events.js
     -- that one was never written down, which is the other half of why this
     file exists. What matters is that it never changes again.

     SLOW -- 18 events x 5 seeds = 90 races. Run it when the driving model,
     rails, ramps, pads or AI change. Not on every commit; that is smoke.sh.
     ========================================================================= -->
<pre id="calib">running…</pre>
<script>
(function () {
  var L = [], G = BR.Game;
  BR.Particles.init();

  /* SEEDED. The AI wanders and errs on purpose (04_AI.md), which is right for
     the game and ruinous for a measurement -- unseeded, the noise floor of a
     race reaches most of a second and the baseline moves under you. */
  var seed = 1;
  Math.random = function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  function once(eventId, s) {
    seed = s;
    var ev = BR.eventById(eventId);
    if (!ev) return null;
    G.startEvent(ev);
    /* Seat one is the player and starts mid-grid (PLAYER_START_BEHIND), so this
       measures a lap driven through traffic, which is what a race target means.
       Do not read racers[0] as "whoever is on pole" -- since the mid-grid
       change that is somebody else's car. */
    var me = G.racers[0];
    me.ai = BR.AIDriver.create('technician', 'normal');
    for (var i = 0; i < G.actors.length; i++)
      if (G.actors[i].racer === me) G.actors[i].kind = 'ai';
    var t = 0;
    while (t < 60 * 400 && !me.finished) { G.step(1 / 60); t++; }
    return me.finished ? me.finishTime : null;
  }

  var SEEDS = [1, 2, 3, 4, 5];
  try {
    for (var i = 0; i < BR.EVENTS.length; i++) {
      var ev = BR.EVENTS[i];
      if (ev.mode !== 'standard-race' && ev.mode !== 'time-trial') continue;
      var ts = [];
      for (var k = 0; k < SEEDS.length; k++) {
        var r = once(ev.id, SEEDS[k]);
        if (r != null) ts.push(r);
      }
      if (!ts.length) { L.push(ev.id + '  DNF'); continue; }
      ts.sort(function (a, b) { return a - b; });
      var med = ts[Math.floor(ts.length / 2)];
      L.push(ev.id + ' ' + med.toFixed(2) + ' spread ' +
             (ts[ts.length - 1] - ts[0]).toFixed(2) +
             ' plat ' + ev.platinumTime);
    }
    L.push('CALIBRATE DONE');
  } catch (e) {
    L.push('THREW: ' + (e && e.message ? e.message : e));
  }
  document.getElementById('calib').textContent = L.join('\n');
})();
</script>
